name: Update Portfolio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests cryptography
      - name: 시세 조회 및 암호화
        env:
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: python update_portfolio.py
      - name: 암호화 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.enc.json
          git diff --staged --quiet || git commit -m "Update portfolio data"
          git push
