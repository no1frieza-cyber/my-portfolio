<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 자산 대시보드</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, 'Malgun Gothic', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; }
  .lock-box { max-width: 360px; margin: 18vh auto; background: #1e293b; padding: 28px; border-radius: 16px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
  .lock-box input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; margin: 12px 0; }
  .lock-box button, .refresh-btn { background: #2563eb; color: #fff; border: none; padding: 11px 18px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .lock-box button { width: 100%; font-size: 16px; }
  .refresh-btn:disabled { background: #475569; cursor: not-allowed; }
  .err { color: #f87171; font-size: 13px; margin-top: 8px; }
  .app { max-width: 1100px; margin: 0 auto; display: none; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .meta { font-size: 13px; color: #94a3b8; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .card { background: #1e293b; padding: 18px; border-radius: 14px; }
  .card .label { font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
  .card .val { font-size: 22px; font-weight: 800; }
  .pos { color: #f87171; }
  .neg { color: #60a5fa; }
  .section { background: #1e293b; border-radius: 14px; padding: 16px; margin-bottom: 16px; overflow-x: auto; }
  .sec-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .sec-head h2 { margin: 0; font-size: 17px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; white-space: nowrap; }
  th, td { padding: 10px 10px; border-bottom: 1px solid #334155; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { color: #94a3b8; font-weight: 600; }
  th.sortable { cursor: pointer; user-select: none; transition: color 0.15s; }
  th.sortable:hover { color: #f8fafc; }
  th.sortable .sort-icon { display: inline-block; margin-left: 4px; font-size: 11px; opacity: 0.4; }
  th.sortable.active { color: #38bdf8; }
  th.sortable.active .sort-icon { opacity: 1; color: #38bdf8; }
  .status-msg { font-size: 13px; color: #38bdf8; margin-bottom: 12px; min-height: 18px; }
</style>
</head>
<body>
  <div class="lock-box" id="lockBox">
    <h2 style="margin:0 0 6px">🔒 개인 자산 대시보드</h2>
    <div class="meta">비밀번호를 입력하면 복호화됩니다</div>
    <input type="password" id="pwInput" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter') unlock()">
    <button onclick="unlock()">잠금 해제</button>
    <div class="err" id="errMsg"></div>
  </div>

  <div class="app" id="app">
    <div class="top-bar">
      <div>
        <h1 style="margin:0;font-size:22px">📊 내 자산 현황</h1>
        <div class="meta" id="metaInfo"></div>
      </div>
      <button class="refresh-btn" id="refreshBtn" onclick="triggerUpdate()">🔄 시세 갱신</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
    <div class="cards" id="summaryCards"></div>
    <div id="sectionsWrap"></div>
  </div>

<script>
let currentPassword = "";
let currentData = null;

// 카테고리별 정렬 상태 저장 ({ col: 필드명, dir: 'asc' | 'desc' })
const sortState = {
  kr: { col: null, dir: null },
  us: { col: null, dir: null },
  crypto: { col: null, dir: null },
  gold: { col: null, dir: null }
};

const COLUMNS = [
  { key: "name", label: "종목명", type: "text" },
  { key: "qty", label: "수량", type: "num" },
  { key: "avg", label: "매수평단가", type: "num" },
  { key: "cur", label: "현재가", type: "num" },
  { key: "eval_krw", label: "평가금액", type: "num" },
  { key: "pnl_krw", label: "평가손익", type: "num" },
  { key: "ret", label: "수익률", type: "num" }
];

const fmtKrw = (n) => Math.round(n).toLocaleString("ko-KR") + "원";
const fmtUsd = (n) => "$" + Number(n).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmtSignKrw = (n) => (n >= 0 ? "+" : "") + fmtKrw(n);
const fmtPct = (n) => (n >= 0 ? "+" : "") + n.toFixed(2) + "%";
const cls = (n) => (n >= 0 ? "pos" : "neg");

function b64ToBytes(b64) {
  return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
}

async function decryptData(encObj, password) {
  const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64ToBytes(encObj.salt), iterations: 100000, hash: "SHA-256" },
    keyMat, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
  );
  const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(encObj.iv) }, key, b64ToBytes(encObj.data));
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

async function fetchEnc() {
  const res = await fetch("data.enc.json?t=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error("데이터 파일이 아직 생성되지 않았습니다.");
  return await res.json();
}

async function unlock() {
  const pw = document.getElementById("pwInput").value;
  const errEl = document.getElementById("errMsg");
  errEl.textContent = "";
  try {
    const enc = await fetchEnc();
    currentData = await decryptData(enc, pw);
    currentPassword = pw;
    document.getElementById("lockBox").style.display = "none";
    document.getElementById("app").style.display = "block";
    render(currentData);
  } catch (e) {
    errEl.textContent = "비밀번호가 틀렸거나 데이터가 아직 없습니다.";
  }
}

function toggleSort(sectionKey, colKey, colType) {
  const state = sortState[sectionKey];
  if (state.col === colKey) {
    state.dir = state.dir === "asc" ? "desc" : "asc";
  } else {
    state.col = colKey;
    state.dir = colType === "text" ? "asc" : "desc";
  }
  render(currentData);
}

function getSortedItems(items, sectionKey) {
  const state = sortState[sectionKey];
  if (!state || !state.col) return items;

  const colDef = COLUMNS.find(c => c.key === state.col);
  const sorted = [...items];
  sorted.sort((a, b) => {
    let cmp = 0;
    if (colDef && colDef.type === "text") {
      cmp = String(a[state.col] || "").localeCompare(String(b[state.col] || ""), "ko");
    } else {
      cmp = (Number(a[state.col]) || 0) - (Number(b[state.col]) || 0);
    }
    return state.dir === "asc" ? cmp : -cmp;
  });
  return sorted;
}

function render(d) {
  const s = d.summary;
  document.getElementById("metaInfo").textContent = `기준 시각: ${d.updated_at} · 적용 환율: ${d.usd_krw.toLocaleString("ko-KR")}원/$`;
  document.getElementById("summaryCards").innerHTML = `
    <div class="card"><div class="label">총 투자원금</div><div class="val">${fmtKrw(s.total_cost_krw)}</div></div>
    <div class="card"><div class="label">총 평가금액</div><div class="val">${fmtKrw(s.total_eval_krw)}</div></div>
    <div class="card"><div class="label">총 평가손익</div><div class="val ${cls(s.total_pnl_krw)}">${fmtSignKrw(s.total_pnl_krw)}</div></div>
    <div class="card"><div class="label">전체 수익률</div><div class="val ${cls(s.total_ret)}">${fmtPct(s.total_ret)}</div></div>
  `;

  const titles = { kr: "🇰🇷 국내주식 · ETF", us: "🇺🇸 미국주식", crypto: "🪙 코인 (업비트)", gold: "🥇 금 (KRX)" };
  let html = "";
  for (const key of ["kr", "us", "crypto", "gold"]) {
    const rawItems = d.sections[key] || [];
    const items = getSortedItems(rawItems, key);
    const subCost = rawItems.reduce((a, b) => a + b.cost_krw, 0);
    const subEval = rawItems.reduce((a, b) => a + b.eval_krw, 0);
    const subPnl = subEval - subCost;
    const subRet = subCost ? (subPnl / subCost * 100) : 0;

    const state = sortState[key];
    const headersHtml = COLUMNS.map(col => {
      const isActive = state.col === col.key;
      const icon = isActive ? (state.dir === "asc" ? "▲" : "▼") : "↕";
      const activeCls = isActive ? "active" : "";
      return `<th class="sortable ${activeCls}" onclick="toggleSort('${key}', '${col.key}', '${col.type}')">${col.label}<span class="sort-icon">${icon}</span></th>`;
    }).join("");

    const rows = items.map(it => {
      const avgStr = it.currency === "USD" ? fmtUsd(it.avg) : Math.round(it.avg).toLocaleString("ko-KR") + "원";
      const curStr = it.currency === "USD" ? fmtUsd(it.cur) : Math.round(it.cur).toLocaleString("ko-KR") + "원";
      return `<tr>
        <td><b>${it.name}</b> <span style="color:#64748b;font-size:11px">${it.symbol}</span></td>
        <td>${Number(it.qty).toLocaleString("ko-KR", {maximumFractionDigits: 4})}</td>
        <td>${avgStr}</td>
        <td>${curStr}</td>
        <td>${fmtKrw(it.eval_krw)}</td>
        <td class="${cls(it.pnl_krw)}"><b>${fmtSignKrw(it.pnl_krw)}</b></td>
        <td class="${cls(it.ret)}"><b>${fmtPct(it.ret)}</b></td>
      </tr>`;
    }).join("");

    html += `<div class="section">
      <div class="sec-head">
        <h2>${titles[key]}</h2>
        <div class="meta">평가 ${fmtKrw(subEval)} · <span class="${cls(subPnl)}"><b>${fmtSignKrw(subPnl)} (${fmtPct(subRet)})</b></span></div>
      </div>
      <table>
        <thead><tr>${headersHtml}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }
  document.getElementById("sectionsWrap").innerHTML = html;
}

async function triggerUpdate() {
  const btn = document.getElementById("refreshBtn");
  const msg = document.getElementById("statusMsg");
  const prevTime = currentData.updated_at;
  btn.disabled = true;
  msg.textContent = "⏳ GitHub Actions에 시세 갱신을 요청하는 중...";

  try {
    const res = await fetch(`https://api.github.com/repos/${currentData.gh.repo}/actions/workflows/update.yml/dispatches`, {
      method: "POST",
      headers: { "Authorization": `Bearer ${currentData.gh.token}`, "Accept": "application/vnd.github+json" },
      body: JSON.stringify({ ref: "main" })
    });
    if (!res.ok) throw new Error("갱신 요청 실패 (토큰 Actions 권한 확인 필요)");

    msg.textContent = "✅ 갱신 시작됨! 최신 시세를 불러오는 중입니다 (약 40~60초 소요)...";
    for (let i = 0; i < 20; i++) {
      await new Promise(r => setTimeout(r, 6000));
      const enc = await fetchEnc();
      if (enc.updated_at !== prevTime) {
        currentData = await decryptData(enc, currentPassword);
        render(currentData);
        msg.textContent = `🎉 최신 시세로 업데이트 완료! (${currentData.updated_at})`;
        btn.disabled = false;
        return;
      }
    }
    msg.textContent = "⚠️ 반영이 지연되고 있습니다. 잠시 후 브라우저를 새로고침해 주세요.";
  } catch (e) {
    msg.textContent = "❌ 오류: " + e.message;
  }
  btn.disabled = false;
}
</script>
</body>
</html>
